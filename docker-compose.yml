version: '3.8'

services:
  izzan-app:
    build: .
    container_name: izzan-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # ⚠️ SECURITY: Set real values in .env file — DO NOT deploy with placeholders!
      # Update NEXTAUTH_URL to your actual domain (e.g. https://yourdomain.com)
      - NEXTAUTH_URL=${NEXTAUTH_URL:?Set NEXTAUTH_URL in .env}
      # Provide a strong 32+ character random secret (generate with: openssl rand -base64 32)
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      # Provide a strong secure token for admin API access
      - ADMIN_TOKEN=${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      # Use local storage provider for VPS persistent disk storage
      - STORAGE_PROVIDER=local
      # Connect to local Redis for rate-limiting (with auth)
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
    volumes:
      # Mount the SQLite database to persist across container restarts
      - ./prisma/dev.db:/app/prisma/dev.db
      # Mount the uploads directory to persist CMS media
      - ./public/uploads:/app/public/uploads
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: izzan-redis
    restart: unless-stopped
    # Redis auth — set REDIS_PASSWORD in .env (no port exposed to host for security)
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data

volumes:
  redis_data:
