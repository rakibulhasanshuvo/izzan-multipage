version: '3.8'

services:
  izzan-app:
    build: .
    container_name: izzan-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # ⚠️ SECURITY: Set real values in .env file — DO NOT deploy with placeholders!
      # Update NEXTAUTH_URL to your actual domain (e.g. https://yourdomain.com)
      - NEXTAUTH_URL=${NEXTAUTH_URL:?Set NEXTAUTH_URL in .env}
      # Provide a strong 32+ character random secret (generate with: openssl rand -base64 32)
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      # Provide a strong secure token for admin API access
      - ADMIN_TOKEN=${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      # Static token auth is opt-in; keep false unless you need it
      - ALLOW_ADMIN_TOKEN=${ALLOW_ADMIN_TOKEN:-false}
      # Set to true ONLY when behind a trusted reverse proxy, otherwise
      # x-forwarded-for is attacker-controlled and rate limits can be bypassed
      - TRUST_PROXY=${TRUST_PROXY:-false}
      # Use local storage provider for VPS persistent disk storage
      - STORAGE_PROVIDER=local
      # Public site URL — used by robots.txt/sitemap/metadata. Must be set at
      # BUILD time too for robots.txt (prerendered); pass as a build arg if needed.
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Connect to local Redis for rate-limiting (with auth)
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      # PostgreSQL connection (internal compose network)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-izzan}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-izzan}
    volumes:
      # Mount the uploads directory to persist CMS media.
      # NOTE: the container runs as UID 1001 (nextjs). On the host run:
      #   sudo chown -R 1001:1001 ./public/uploads
      # or uploads will fail with EACCES.
      - ./public/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: izzan-postgres
    restart: unless-stopped
    # Loopback-only exposure so the host can run `prisma migrate deploy` /
    # `pg_dump` without exposing the database to the public internet.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-izzan}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-izzan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-izzan} -d ${POSTGRES_DB:-izzan}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: izzan-redis
    restart: unless-stopped
    # Redis auth — REDIS_PASSWORD is required in .env (no default, no host port exposed)
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
